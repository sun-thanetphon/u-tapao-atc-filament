services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: utapao-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    networks:
      - utapao-network

  webserver:
    image: nginx:alpine
    container_name: utapao-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - utapao-network

  db:
    image: mysql:8.0
    container_name: utapao-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: utapao_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      # ผูกกับเครื่องนี้เท่านั้น และใช้ 3307 ไม่ให้ชนกับ MySQL ของ XAMPP (ภายใน Docker ยังใช้ db:3306 เหมือนเดิม)
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - utapao-network

networks:
  utapao-network:
    driver: bridge

volumes:
  dbdata:
    driver: local